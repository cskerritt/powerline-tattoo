<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dana Morse — Tattoo Portfolio | Powerline Tattoo Cranston RI</title>
  <meta name="description" content="Dana Morse tattoo portfolio at Powerline Tattoo in Cranston, RI. Specializing in everything from bold traditional to intricate realism. View her custom tattoo work and book an appointment.">
  <meta property="og:title" content="Dana Morse — Tattoo Portfolio | Powerline Tattoo">
  <meta property="og:description" content="Versatile tattoos — traditional to realism — by Dana Morse at Powerline Tattoo, Cranston RI.">
  <meta property="og:image" content="/images/gallery/dana-morse/dana-01.jpg">
  <link rel="icon" type="image/png" href="/favicon.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Montserrat:wght@300;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/styles.css">
  <style>
    .artist-hero { padding: calc(var(--nav-height) + 60px) 0 40px; }
    .artist-hero .container { display: flex; gap: 40px; align-items: center; }
    .artist-hero-photo { width: 180px; height: 180px; border-radius: 50%; object-fit: cover; border: 3px solid var(--accent); flex-shrink: 0; }
    .artist-hero-info h1 { font-size: clamp(1.75rem, 4vw, 2.5rem); margin-bottom: 8px; }
    .artist-hero-info .specialty { color: var(--accent); font-family: var(--font-heading); font-size: 0.85rem; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 12px; }
    .artist-hero-info .bio { color: var(--text-muted); line-height: 1.7; margin-bottom: 20px; max-width: 600px; }
    .artist-hero-info .artist-links { display: flex; gap: 12px; flex-wrap: wrap; }
    .artist-hero-info .btn { padding: 12px 24px; font-size: 0.8rem; }
    .portfolio-section { padding: 40px 0 100px; }
    .portfolio-grid { columns: 3; column-gap: 12px; }
    .portfolio-item { break-inside: avoid; margin-bottom: 12px; position: relative; overflow: hidden; border-radius: 4px; cursor: pointer; }
    .portfolio-item img { width: 100%; display: block; transition: transform 0.4s ease; }
    .portfolio-item:hover img { transform: scale(1.03); }
    @media (max-width: 768px) {
      .artist-hero .container { flex-direction: column; text-align: center; }
      .artist-hero-info .artist-links { justify-content: center; }
      .portfolio-grid { columns: 2; }
    }
  </style>
</head>
<body data-page="artists">
  <!-- Artist Hero -->
  <section class="artist-hero">
    <div class="container">
      <img class="artist-hero-photo" src="/images/artists/dana-morse.jpg" alt="Dana Morse">
      <div class="artist-hero-info">
        <h1>Dana Morse</h1>
        <p class="specialty">Versatile — Traditional to Realism — Resident Artist, 18+ Years</p>
        <p class="bio">I've been tattooing for over 18 years — I started at age 18 in Saint Johnsbury, Vermont. I specialize in everything from bold traditional to intricate realism.</p>
        <div class="artist-links">
          <a href="/book" class="btn btn-primary">Book Dana</a>
          <a href="https://instagram.com/danamorsetattoos" target="_blank" rel="noopener" class="btn btn-outline">@danamorsetattoos</a>
          <a href="/artists" class="btn btn-outline">All Artists</a>
        </div>
      </div>
    </div>
  </section>

  <!-- Portfolio (auto-updated from Instagram) -->
  <section class="portfolio-section">
    <div class="container">
      <div class="behold-feed" data-behold-id="O4ztCvIw8n22hHiuUtVz" data-behold-count="24" data-behold-columns="3"></div>
    </div>
  </section>

  <script src="/js/main.js"></script>
  <script src="/js/behold-feed.js?v=4"></script>
</body>

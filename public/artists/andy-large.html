  <style>
    .artist-hero { padding: calc(var(--nav-height) + 60px) 0 40px; }
    .artist-hero .container { display: flex; gap: 40px; align-items: center; }
    .artist-hero-photo { width: 180px; height: 180px; border-radius: 50%; object-fit: cover; border: 3px solid var(--accent); flex-shrink: 0; }
    .artist-hero-info h1 { font-size: clamp(1.75rem, 4vw, 2.5rem); margin-bottom: 8px; }
    .artist-hero-info .specialty { color: var(--accent); font-family: var(--font-heading); font-size: 0.85rem; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 12px; }
    .artist-hero-info .bio { color: var(--text-muted); line-height: 1.7; margin-bottom: 20px; max-width: 600px; }
    .artist-hero-info .artist-links { display: flex; gap: 12px; flex-wrap: wrap; }
    .artist-hero-info .btn { padding: 12px 24px; font-size: 0.8rem; }
    .portfolio-section { padding: 40px 0 100px; }
    .portfolio-grid { columns: 3; column-gap: 12px; }
    .portfolio-item { break-inside: avoid; margin-bottom: 12px; position: relative; overflow: hidden; border-radius: 4px; cursor: pointer; }
    .portfolio-item img { width: 100%; display: block; transition: transform 0.4s ease; }
    .portfolio-item:hover img { transform: scale(1.03); }
    @media (max-width: 768px) {
      .artist-hero .container { flex-direction: column; text-align: center; }
      .artist-hero-info .artist-links { justify-content: center; }
      .portfolio-grid { columns: 2; }
    }
  </style>
</head>

        <p class="bio">Born and raised in Rhode Island, I focus on dynamic realism tattoos with surreal elements. My favorite subjects are nature, animals, flowers, human portraiture, and space.</p>
        <div class="artist-links">

          <a href="https://instagram.com/andylargetattoo" target="_blank" rel="noopener" class="btn btn-outline">@andylargetattoo</a>
          <a href="/artists" class="btn btn-outline">All Artists</a>
        </div>
      </div>
    </div>
  </section>

  <!-- Lightbox -->
  <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Image lightbox">
    <button class="lightbox-close" id="lightbox-close" aria-label="Close lightbox">&times;</button>
    <button class="lightbox-nav lightbox-prev" id="lightbox-prev" aria-label="Previous image">&#8592;</button>
    <div class="lightbox-content">
      <img class="lightbox-img" id="lightbox-img" src="" alt="Enlarged tattoo photo">
    </div>
    <button class="lightbox-nav lightbox-next" id="lightbox-next" aria-label="Next image">&#8594;</button>
  </div>

  <script src="/js/main.js"></script>
  <script>
    const items = document.querySelectorAll('.portfolio-item');
    const lightbox = document.getElementById('lightbox');
    const lbImg = document.getElementById('lightbox-img');
    const lbClose = document.getElementById('lightbox-close');
    const lbPrev = document.getElementById('lightbox-prev');
    const lbNext = document.getElementById('lightbox-next');
    let currentIdx = 0;
    const srcs = Array.from(items).map(i => i.querySelector('img').src);

    items.forEach((item, i) => {
      item.addEventListener('click', () => { currentIdx = i; showLightbox(); });
    });
    function showLightbox() { lbImg.src = srcs[currentIdx]; lightbox.classList.add('active'); }
    function hideLightbox() { lightbox.classList.remove('active'); }
    lbClose.addEventListener('click', hideLightbox);
    lightbox.addEventListener('click', e => { if (e.target === lightbox) hideLightbox(); });
    lbPrev.addEventListener('click', () => { currentIdx = (currentIdx - 1 + srcs.length) % srcs.length; showLightbox(); });
    lbNext.addEventListener('click', () => { currentIdx = (currentIdx + 1) % srcs.length; showLightbox(); });
    document.addEventListener('keydown', e => {
      if (!lightbox.classList.contains('active')) return;
      if (e.key === 'Escape') hideLightbox();
      if (e.key === 'ArrowLeft') { currentIdx = (currentIdx - 1 + srcs.length) % srcs.length; showLightbox(); }
      if (e.key === 'ArrowRight') { currentIdx = (currentIdx + 1) % srcs.length; showLightbox(); }
    });
  </script>
